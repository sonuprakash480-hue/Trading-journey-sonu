<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Journal</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6eb;--ac:#0f766e;--up:#0a8f4e;--dn:#d23b3b;--hi:#e7f6f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mu:#97a1af;--bd:#2a323d;--ac:#2dd4bf;--up:#3ddc84;--dn:#ff6b6b;--hi:#12302d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mu:#97a1af;--bd:#2a323d;--ac:#2dd4bf;--up:#3ddc84;--dn:#ff6b6b;--hi:#12302d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px 14px 40px;max-width:900px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card small{color:var(--mu);display:block;font-size:12px}
.card b{font-size:18px}
.up{color:var(--up)}.dn{color:var(--dn)}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--card)}
tr.today td{background:var(--hi)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
td input{width:90px;padding:5px 6px;text-align:right}
td input.note{width:140px;text-align:left}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;width:100%;margin-top:10px}
.btn.alt{background:transparent;color:var(--dn);border:1px solid var(--dn)}
.hint{color:var(--mu);font-size:12px;margin:8px 2px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac)}
</style>
</head>
<body>
<h1>📒 Trading Journal</h1>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<script>
const $=s=>document.querySelector(s);
const iso=d=>d.toISOString().slice(0,10);
const todayS=(()=>{const n=new Date();return iso(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())))})();
const addD=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return iso(new Date(Date.UTC(y,m-1,d+n)))};
const diff=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(){try{localStorage.setItem('tj_s',JSON.stringify(S));localStorage.setItem('tj_e',JSON.stringify(E))}catch(e){}}
let S=load('tj_s',{start:todayS,goal:addD(todayS,364),cap:10,rate:3,cur:'$'});
let E=load('tj_e',{});
let tab='today';
const fmt=n=>(n<0?'-':'')+S.cur+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=n=>n>0?'up':n<0?'dn':'';
const dfmt=s=>{const d=new Date(s+'T00:00:00Z');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'})};

function compute(){
  const r=S.rate/100, n=Math.min(Math.max(diff(S.start,S.goal)+1,1),1500);
  const rows=[];let bal=+S.cap, plan=+S.cap;
  for(let i=0;i<n;i++){
    const date=addD(S.start,i), e=E[date]||{};
    const open=bal, target=open*r;
    const planOpen=plan, planClose=plan*(1+r);
    const has=e.pnl!==undefined&&e.pnl!=='';
    const pnl=has?+e.pnl:null;
    const close=has?open+pnl:null;
    if(has)bal=close;
    plan=planClose;
    rows.push({i,date,open,target,tclose:open+target,has,pnl,close,extra:has?pnl-target:null,note:e.note||'',planOpen,planClose});
  }
  return {rows,bal,plan};
}

function setTab(t){tab=t;render()}
function render(){
  const names={today:'Aaj',ledger:'Daily',weekly:'Weekly',monthly:'Monthly',settings:'Goal Setup'};
  $('#tabs').innerHTML=Object.keys(names).map(k=>`<button class="${k===tab?'on':''}" onclick="setTab('${k}')">${names[k]}</button>`).join('');
  const C=compute();
  $('#view').innerHTML=({today:vToday,ledger:vLedger,weekly:vWeekly,monthly:vMonthly,settings:vSettings})[tab](C);
}

function vToday(C){
  const {rows}=C, r=S.rate/100;
  let k=rows.findIndex(x=>x.date===todayS); if(k<0)k=todayS<S.start?0:rows.length-1;
  const t=rows[k];
  const weekTarget=rows.slice(k,k+7).reduce((a,x)=>a+x.target,0);
  const wp=Math.pow(1+r,7)-1;
  const mon=t.date.slice(0,7), mrows=rows.filter(x=>x.date.slice(0,7)===mon);
  const monTarget=mrows.reduce((a,x)=>a+x.target,0), monDone=mrows.reduce((a,x)=>a+(x.has?x.pnl:0),0);
  const lastIdx=rows.length-1, goalBal=C.bal*Math.pow(1+r,Math.max(lastIdx-rows.filter(x=>x.has).length+1,0));
  const doneDays=rows.filter(x=>x.has).length;
  const ahead=C.bal-rows[Math.max(doneDays-1,0)].planClose*(doneDays?1:0)-(doneDays?0:0);
  const planNow=doneDays?rows[doneDays-1].planClose:+S.cap;
  const diffPlan=C.bal-planNow;
  const prog=Math.min(100,Math.max(0,(C.bal/C.plan)*100));
  return `<div class="card" style="margin-bottom:12px"><small>${dfmt(t.date)} · Day ${t.i+1} / ${rows.length}</small>
  <div class="grid" style="margin:8px 0 0">
   <div><small>Opening balance</small><b>${fmt(t.open)}</b></div>
   <div><small>Aaj ka target profit (${S.rate}%)</small><b class="up">${fmt(t.target)}</b></div>
   <div><small>Target closing</small><b>${fmt(t.tclose)}</b></div>
   <div><small>Actual P&amp;L (aaj)</small><b class="${cls(t.pnl)}">${t.has?fmt(t.pnl):'—'}</b></div>
  </div>
  <label>Aaj ka P&amp;L (${S.cur}) — profit ya loss (-)</label>
  <input type="number" step="any" inputmode="decimal" id="tp" value="${t.has?t.pnl:''}" placeholder="e.g. 0.45" onchange="setPnl('${t.date}',this.value)">
  <label>Journal note</label>
  <input id="tn" value="${esc(t.note)}" placeholder="Aaj kya seekha / kaisa trade raha" onchange="setNote('${t.date}',this.value)">
  ${t.has?`<p style="margin:10px 0 0">Closing balance: <b>${fmt(t.close)}</b><br>${t.extra>=0?`<span class="up">Extra profit: +${fmt(t.extra)} 🎉</span>`:`<span class="dn">Target se kam: ${fmt(t.extra)}</span>`}</p>`:''}
  </div>
  <div class="grid">
   <div class="card"><small>Is hafte ka target (~${(wp*100).toFixed(1)}%)</small><b>${fmt(weekTarget)}</b></div>
   <div class="card"><small>Is mahine ka target</small><b>${fmt(monTarget)}</b><small>Ab tak: <span class="${cls(monDone)}">${fmt(monDone)}</span></small></div>
   <div class="card"><small>Current balance</small><b>${fmt(C.bal)}</b></div>
   <div class="card"><small>Plan ke mutabik (${doneDays} din baad)</small><b>${fmt(planNow)}</b><small class="${cls(diffPlan)}">${diffPlan>=0?'Aage':'Peeche'}: ${fmt(Math.abs(diffPlan))}</small></div>
   <div class="card" style="grid-column:1/3"><small>Goal date ${dfmt(S.goal)} ka plan balance</small><b>${fmt(C.plan)}</b>
    <div class="bar"><i style="width:${prog}%"></i></div></div>
  </div>`;
}

function vLedger(C){
  return `<div class="wrap" style="max-height:70vh"><table><tr><th>Date</th><th>Day</th><th>Opening</th><th>Target P&amp;L</th><th>Target Close</th><th>Actual P&amp;L</th><th>Closing</th><th>Extra</th><th>Note</th></tr>
  ${C.rows.map(x=>`<tr class="${x.date===todayS?'today':''}"><td>${dfmt(x.date)}</td><td>${x.i+1}</td><td>${fmt(x.open)}</td><td>${fmt(x.target)}</td><td>${fmt(x.tclose)}</td>
  <td><input type="number" step="any" inputmode="decimal" value="${x.has?x.pnl:''}" onchange="setPnl('${x.date}',this.value)"></td>
  <td>${x.has?fmt(x.close):'—'}</td>
  <td class="${x.has?cls(x.extra):''}">${x.has?(x.extra>=0?'+':'')+fmt(x.extra):'—'}</td>
  <td><input class="note" value="${esc(x.note)}" onchange="setNote('${x.date}',this.value)"></td></tr>`).join('')}</table></div>
  <p class="hint">Har din ka P&amp;L daalo — agle din ka opening balance apne aap update hoga. Extra = actual profit − target profit.</p>`;
}

function group(rows,keyf){
  const m=new Map();
  rows.forEach(x=>{const k=keyf(x);if(!m.has(k))m.set(k,{k,days:0,done:0,target:0,pnl:0,open:x.open,close:x.open,first:x.date,last:x.date});
    const g=m.get(k);g.days++;g.target+=x.target;g.last=x.date;if(x.has){g.done++;g.pnl+=x.pnl;g.close=x.close}});
  return [...m.values()];
}
function gTable(gs,label){
  return `<div class="wrap"><table><tr><th>${label}</th><th>Din</th><th>Opening</th><th>Target</th><th>Actual</th><th>Extra</th><th>Closing</th></tr>
  ${gs.map(g=>{const ex=g.pnl-g.target;return `<tr><td>${g.lab}</td><td>${g.done}/${g.days}</td><td>${fmt(g.open)}</td><td>${fmt(g.target)}</td><td class="${cls(g.pnl)}">${g.done?fmt(g.pnl):'—'}</td><td class="${g.done?cls(ex):''}">${g.done?(ex>=0?'+':'')+fmt(ex):'—'}</td><td>${g.done?fmt(g.close):'—'}</td></tr>`}).join('')}</table></div>`;
}
function vWeekly(C){
  const gs=group(C.rows,x=>Math.floor(x.i/7)).map(g=>({...g,lab:`W${g.k+1} · ${dfmt(g.first).slice(0,6)}`}));
  return gTable(gs,'Week')+`<p class="hint">Weekly target = us hafte ke daily targets ka total (compounding ke saath).</p>`;
}
function vMonthly(C){
  const gs=group(C.rows,x=>x.date.slice(0,7)).map(g=>{const d=new Date(g.k+'-01T00:00:00Z');return {...g,lab:d.toLocaleDateString('en-GB',{month:'short',year:'numeric',timeZone:'UTC'})}});
  return gTable(gs,'Month');
}

function vSettings(){
  return `<div class="card"><label>Starting date</label><input type="date" id="s1" value="${S.start}">
  <label>Goal date</label><input type="date" id="s2" value="${S.goal}">
  <label>Starting capital</label><input type="number" step="any" id="s3" value="${S.cap}">
  <label>Daily interest / target (%)</label><input type="number" step="any" id="s4" value="${S.rate}">
  <label>Currency symbol</label><input id="s5" value="${esc(S.cur)}" maxlength="3">
  <button class="btn" onclick="saveSet()">Save goal</button>
  <button class="btn alt" onclick="resetAll()">Saara data reset karo</button></div>
  <p class="hint">Data sirf is device ke browser mein save hota hai. Dates ya % badalne par purani entries date ke hisaab se rahengi.</p>`;
}
function saveSet(){
  const s={start:$('#s1').value,goal:$('#s2').value,cap:+$('#s3').value,rate:+$('#s4').value,cur:$('#s5').value||'$'};
  if(!s.start||!s.goal||s.goal<s.start||!(s.cap>0)||isNaN(s.rate)){alert('Dates aur amount sahi daalo (goal date start ke baad honi chahiye).');return}
  S=s;save();tab='today';render();
}
function resetAll(){if(confirm('Saari entries delete ho jayengi. Pakka?')){E={};save();render()}}
function setPnl(d,v){E[d]=E[d]||{};if(v==='')delete E[d].pnl;else E[d].pnl=+v;save();render()}
function setNote(d,v){E[d]=E[d]||{};E[d].note=v;save();}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
render();
</script>
</body>
</html>
